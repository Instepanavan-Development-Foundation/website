server {
    listen 80;
    listen [::]:80;

    server_name www.instepanavan.am;
    return 301 $scheme://instepanavan.am$request_uri;
}

server {
    listen 80;
    listen [::]:80;

    server_name instepanavan.am;

    client_max_body_size 100M;

    location ~ ^/api/ {
        proxy_pass    http://server:1337;
    }

    location ~ ^/uploads/ {
        proxy_pass    http://server:1337;
    }

    # On-demand WebP thumbnails: /thumb/<width>/uploads/<file>. Only these widths are allowed
    # (keep in sync with client/src/helpers/getThumbUrl.ts) so nobody can make us render
    # arbitrary sizes. Thumbor caches results on disk; Cloudflare/browsers cache for a year
    # (upload filenames contain a content hash).
    location ~* "^/thumb/(?<thumb_w>160|320|640|1280|1920)/uploads/(?<thumb_file>[^/]+\.(?:jpe?g|png|webp))$" {
        # Docker DNS, resolved per request so a recreated thumbor container is picked up.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $thumbor_upstream thumbor:80;
        proxy_pass http://$thumbor_upstream/unsafe/${thumb_w}x0/filters:format(webp):no_upscale()/$thumb_file;
        # Fail fast to the original if Thumbor is down (default connect timeout is 60s).
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        proxy_intercept_errors on;
        error_page 400 404 500 502 503 504 = @original_upload;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Unknown widths/types, or Thumbor unavailable: serve the original upload.
    location ~ ^/thumb/\d+/uploads/ {
        rewrite ^/thumb/\d+(/uploads/.*)$ $1 last;
    }

    location @original_upload {
        rewrite ^/thumb/\d+(/uploads/.*)$ $1 break;
        proxy_pass    http://server:1337;
    }

    location / {
        proxy_pass    http://client:3000;
    }
}

server {
    listen 80;
    listen [::]:80;

    server_name api.instepanavan.am;

    client_max_body_size 100M;

    location / {
        proxy_pass    http://server:1337;
    }
}
