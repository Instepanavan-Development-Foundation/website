services:
  postgres:
    image: postgres:17
    container_name: strapi_postgres_prod
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./postgres:/var/lib/postgresql/data
    networks:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 10s
      retries: 5

  server:
    image: server
    restart: unless-stopped
    env_file:
      - ./server/.env
    volumes:
      - ./server-data:/opt/app/public/uploads
    user: "${UID}:${GID}"
    depends_on:
      - postgres
    networks:
      - postgres
      - nginx
      - hatchet

  client:
    image: client
    restart: unless-stopped
    environment:
      # TODO: check if this is needed
      - HOSTNAME=0.0.0.0
    # Removed volume mount for security - image contains built app
    depends_on:
      - server
    networks:
      - nginx

  hatchet:
    image: ghcr.io/hatchet-dev/hatchet/hatchet-lite:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://hatchet:hatchet@hatchet_postgres:5432/hatchet"
      SERVER_AUTH_COOKIE_DOMAIN: "localhost"
      SERVER_GRPC_BIND_ADDRESS: "0.0.0.0"
      SERVER_GRPC_BROADCAST_ADDRESS: "hatchet:7070"
      SERVER_GRPC_INSECURE: "t"
      # Defaults (50/50 conns, 10 kept warm) cost ~45MB per idle Postgres backend; one monthly cron needs far fewer
      DATABASE_MAX_CONNS: "10"
      DATABASE_MIN_CONNS: "1"
      DATABASE_MAX_QUEUE_CONNS: "10"
      DATABASE_MIN_QUEUE_CONNS: "1"
      DATABASE_MAX_CONN_IDLE_TIME: "1m"
      DATABASE_MAX_CONN_LIFETIME: "5m"
    volumes:
      - ./hatchet-data:/data
      - ./hatchet-config:/config
    depends_on:
      hatchet_postgres:
        condition: service_healthy
    networks:
      - hatchet

  hatchet_postgres:
    image: postgres:17
    restart: unless-stopped
    hostname: "hatchet_postgres"
    environment:
      POSTGRES_USER: hatchet
      POSTGRES_PASSWORD: hatchet
      POSTGRES_DB: hatchet
    volumes:
      - ./hatchet-data/postgres:/var/lib/postgresql/data
    networks:
      - hatchet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d hatchet -U hatchet"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 10s

  wireguard:
    image: linuxserver/wireguard:latest
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=${UID}
      - PGID=${GID}
      - TZ=Asia/Yerevan
      - SERVERURL=instepanavan.am
      - SERVERPORT=51820
      - PEERS=1
      - PEERDNS=auto
      - INTERNAL_SUBNET=10.13.13.0
    volumes:
      - ./wireguard-config:/config
      - /lib/modules:/lib/modules:ro
    ports:
      - 51820:51820/udp
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    networks:
      - postgres
      - hatchet

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:39930:80"
    depends_on:
      - server
      - client
    networks:
      - nginx

  # On-demand thumbnails for /thumb/ (see nginx/nginx.conf). Thumbor uses Pillow, which runs on
  # this host's CPU; sharp/libvips-based tools (incl. imgproxy) crash with illegal instructions.
  # Reachable only from nginx — "unsafe" URLs are fine because nginx allow-lists the sizes.
  thumbor:
    image: ghcr.io/minimalcompact/thumbor@sha256:7b3f040945d6573c70107f7c4bb67d73f15779327b9b79cca99460b6fae6ffbb
    restart: unless-stopped
    environment:
      THUMBOR_NUM_PROCESSES: "2"
      LOADER: thumbor.loaders.file_loader
      FILE_LOADER_ROOT_PATH: /uploads
      ALLOW_UNSAFE_URL: "True"
      RESULT_STORAGE: thumbor.result_storages.file_storage
      RESULT_STORAGE_FILE_STORAGE_ROOT_PATH: /cache/results
      RESULT_STORAGE_STORES_UNSAFE: "True"
      QUALITY: "80"
      WEBP_QUALITY: "80"
      MAX_AGE: "31536000"
    volumes:
      - ./server-data:/uploads:ro
      - thumbor-cache:/cache
    mem_limit: 512m
    networks:
      - nginx

  telegram-bot:
    image: telegram-bot
    container_name: instepanavan-telegram-bot
    restart: unless-stopped
    env_file:
      - ./telegram-bot/.env
    networks:
      - telegram

  rss-publisher:
    image: rss-publisher
    container_name: instepanavan-rss-publisher
    restart: unless-stopped
    env_file:
      - ./rss-publisher/.env
    volumes:
      - ./rss-publisher-data:/app/data
    networks:
      - nginx

volumes:
  thumbor-cache:

networks:
  nginx:
    name: saint-nginx
    external: true
  postgres:
  hatchet:
  telegram:
